server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name granum-stone.ru www.granum-stone.ru granum174.ru www.granum174.ru granum74.ru www.granum74.ru;

    ssl_certificate /etc/letsencrypt/live/granum-stone.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/granum-stone.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /media/ {
        proxy_pass http://127.0.0.1:9000/granum-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name granum-stone.ru www.granum-stone.ru granum174.ru www.granum174.ru granum74.ru www.granum74.ru;
    return 301 https://$host$request_uri;
}
